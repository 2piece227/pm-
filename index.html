<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트레이너 매니지먼트 — 관동·성도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7;--panel:#fff;--panel2:#f5f7fb;--ink:#1a2233;--sub:#5a6580;
  --line:#c3cddd;--line2:#dde4ef;--accent:#2f5da8;
  --hp-hi:#48c05a;--hp-md:#e8b423;--hp-lo:#e0503f;
  --sky1:#8ec8e8;--sky2:#c8e4f0;--ground:#d8c88a;--ground2:#c0b070;
  --box:#f8f8f8;--boxline:#485870;--red:#c0392b;--blue:#2f5da8;--gold:#a8770b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f;--panel:#1b212e;--panel2:#232b3b;--ink:#e6ecf5;--sub:#9aa7bd;
  --line:#39445a;--line2:#2b3446;--accent:#7aa0dd;
  --sky1:#2a4a68;--sky2:#1e3448;--ground:#4a4430;--ground2:#3a3626;
  --box:#252d3d;--boxline:#7a8aa8;--red:#e5776a;--blue:#7aa0dd;--gold:#d9b64a;}}
:root[data-theme="dark"]{
  --bg:#12161f;--panel:#1b212e;--panel2:#232b3b;--ink:#e6ecf5;--sub:#9aa7bd;
  --line:#39445a;--line2:#2b3446;--accent:#7aa0dd;
  --sky1:#2a4a68;--sky2:#1e3448;--ground:#4a4430;--ground2:#3a3626;
  --box:#252d3d;--boxline:#7a8aa8;--red:#e5776a;--blue:#7aa0dd;--gold:#d9b64a;}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);
  font-family:'Gothic A1',-apple-system,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:17px;margin:0 0 3px}
.sub{color:var(--sub);font-size:12px;margin-bottom:12px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.panel-t{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}

/* ===== 배틀 화면 — 5세대 실기 배치를 따라간다 ===== */
.scene{position:relative;width:100%;aspect-ratio:4/2.55;min-height:230px;border-radius:6px;
  border:3px solid var(--boxline);overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,var(--ground2) 60%,var(--ground) 100%)}
.scene[data-weather="Sandstorm"]{background:linear-gradient(180deg,#c9ac72 0%,#d8c08a 60%,#b09a5e 60%,#c2ad72 100%)}
.scene[data-weather="Sandstorm"]::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(72deg,rgba(255,240,200,.16) 0 2px,transparent 2px 7px);
  animation:sand 700ms linear infinite}
@keyframes sand{to{background-position:34px 0}}

.plat{position:absolute;border-radius:50%;background:rgba(0,0,0,.16)}
.plat.foe{width:30%;height:8%;right:9%;top:42%}
.plat.me{width:36%;height:9%;left:7%;bottom:13%}

.spr{position:absolute;transition:transform .16s ease,opacity .35s}
.spr.foe{width:24%;right:12%;top:12%}
.spr.me{width:30%;left:8%;bottom:13%}
.spr svg,.spr img{width:100%;height:auto;display:block;image-rendering:pixelated;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.32))}
.spr.hit{animation:shk .3s}
.spr.hurt svg,.spr.hurt img{filter:brightness(0) invert(1) drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.spr.dead{transform:translateY(42px);opacity:0}
.spr.enter{animation:enter .45s ease-out}
.spr.glow svg,.spr.glow img{filter:drop-shadow(0 0 7px #ffe08a) drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.spr.cast{animation:cast .3s ease-out}
.spr.lunge-r{transform:translateX(15%) translateY(-7%)}
.spr.lunge-l{transform:translateX(-15%) translateY(7%)}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8%)}
  45%{transform:translateX(7%)}70%{transform:translateX(-4%)}}
@keyframes enter{0%{opacity:0;transform:translateY(16px) scale(.85)}100%{opacity:1;transform:none}}
@keyframes cast{0%,100%{transform:scale(1)}45%{transform:scale(1.07)}}

/* HP 박스 — 실기처럼 이름/성별/Lv + HP 라벨 바, 내 쪽만 실수치 */
.hpbox{position:absolute;background:var(--box);border:2px solid var(--boxline);border-radius:5px;
  padding:3px 7px 4px;width:46%;box-shadow:1px 2px 0 rgba(0,0,0,.22)}
.hpbox.foe{left:3%;top:5%}
.hpbox.me{right:3%;bottom:5%}
.hpb-n{font-size:11.5px;font-weight:800;display:flex;justify-content:space-between;
  align-items:baseline;gap:5px;line-height:1.25}
.hpb-n em{font-style:normal;font-weight:700;color:var(--sub);font-size:10px}
.hpb-n i{font-style:normal;font-size:10px;margin-left:2px}
.hpb-n i.g-m{color:#5a9ad8}.hpb-n i.g-f{color:#d87a9a}
.hpb-n i.st{background:var(--accent);color:#fff;border-radius:3px;padding:0 4px;
  font-size:9px;font-weight:800;margin-left:4px;vertical-align:1px}
.hpb-row{display:flex;align-items:center;gap:4px;margin-top:2px}
.hplabel{font-size:8.5px;font-weight:800;color:#d8b23a;letter-spacing:.5px}
.hpb-bar{flex:1;height:6px;background:#4a4a4a;border-radius:3px;overflow:hidden;
  border:1px solid var(--boxline)}
.hpb-bar i{display:block;height:100%;transition:width .5s ease}
.hpb-num{text-align:right;font-size:10px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.2;margin-top:1px}
.hpb-boost{font-size:9px;color:var(--gold);font-weight:700;line-height:1.2}

/* 이펙트 */
.fx{position:absolute;pointer-events:none;font-weight:800;font-size:15px;z-index:4;
  text-shadow:0 0 6px rgba(0,0,0,.6);animation:fxup .9s ease-out forwards}
@keyframes fxup{0%{opacity:0;transform:translateY(6px) scale(.8)}
  25%{opacity:1;transform:translateY(-2px) scale(1.1)}100%{opacity:0;transform:translateY(-28px)}}
.burst{position:absolute;border-radius:50%;pointer-events:none;z-index:3;
  animation:brs .46s ease-out forwards}
@keyframes brs{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(2.7)}}
.particle{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:3;
  animation:part .62s ease-out forwards}
@keyframes part{0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.proj{position:absolute;width:13%;padding-bottom:13%;border-radius:50%;pointer-events:none;z-index:3;
  animation:proj linear forwards}
@keyframes proj{0%{opacity:.4;transform:translate(0,0) scale(.6)}
  20%{opacity:1;transform:translate(calc(var(--tx)*.2),calc(var(--ty)*.2)) scale(1)}
  100%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1.1)}}
.flash{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;
  animation:flsh ease-out forwards}
@keyframes flsh{0%{opacity:0}25%{opacity:.45}100%{opacity:0}}

/* 자막 박스 — 실기처럼 2줄, 아래쪽 전체 폭 */
.tbox{margin-top:6px;background:#1a1f2b;border:3px solid var(--boxline);border-radius:6px;
  padding:9px 13px;min-height:62px;font-size:14px;font-weight:700;line-height:1.55;color:#f2f5fa;
  text-shadow:1px 1px 0 rgba(0,0,0,.55)}
.tbox .tline{min-height:1.55em;white-space:pre-wrap}

.trainers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.trainers{grid-template-columns:1fr}}
.tcard{background:var(--panel2);border:2px solid var(--line2);border-radius:8px;padding:10px}
.tname{font-weight:800;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.stat{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:12px}
.stat b{width:44px;font-weight:400;color:var(--sub)}
.stat input[type=range]{flex:1;min-width:0;height:15px;accent-color:var(--accent);cursor:pointer}
.stat span{width:22px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
select{font-family:inherit;font-size:11px;padding:3px 5px;border-radius:5px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;
  border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
label.chk{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px;cursor:pointer}
#log{background:var(--panel2);border:2px solid var(--line2);border-radius:8px;padding:10px;
  height:280px;overflow-y:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;
  line-height:1.6;white-space:pre-wrap;word-break:break-word}
.l-turn{color:var(--accent);font-weight:700;margin-top:7px;border-top:1px dashed var(--line);padding-top:5px}
.l-turn:first-child{margin-top:0;border-top:none;padding-top:0}
.l-red{color:var(--red)}.l-blue{color:var(--blue)}.l-sub{color:var(--sub)}.l-gold{color:var(--gold)}
.l-think{color:var(--sub);font-size:11px;padding-left:9px;border-left:2px solid var(--line2)}
.l-win{font-weight:800;color:var(--gold);margin-top:7px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
th,td{border:1px solid var(--line2);padding:5px 7px;text-align:left}
th{background:var(--panel2);color:var(--sub)}td.n{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--sub);line-height:1.7}
.sub-t{color:var(--sub);font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{background:transparent;color:var(--sub);border:2px solid var(--line2)}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lg-row{cursor:pointer}
.lg-row:hover td{background:var(--panel2)}
.lg-row.on td{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
.lg-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.lg-cols{grid-template-columns:1fr}}

/* ===== 게임 UI ===== */
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.topbar .who{font-weight:800;font-size:15px}
.stats-row{display:flex;flex-wrap:wrap;gap:14px;font-size:12px}
.stats-row b{font-size:14px;font-variant-numeric:tabular-nums}
.stats-row .neg{color:var(--red)}
#btn-day{font-size:14px;padding:10px 20px}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.tcards{grid-template-columns:1fr}}
.tc{background:var(--panel2);border:2px solid var(--line2);border-radius:8px;padding:10px}
.tc-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:5px}
.tc-h b{font-size:14px}
.cond{height:7px;background:var(--line2);border-radius:4px;overflow:hidden;margin:4px 0}
.cond i{display:block;height:100%;transition:width .3s}
.tc select{width:100%;margin-top:6px;font-size:12px;padding:5px}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;
  border:1px solid var(--line);color:var(--sub)}
.stars{color:var(--gold);letter-spacing:1px}
.rep-line{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--sub);margin-top:3px}
.dayrep{background:var(--panel2);border:2px solid var(--line2);border-radius:8px;padding:10px;font-size:12px;line-height:1.7}
.dayrep .big{font-weight:800;font-size:13px}
.mkt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.mkt{grid-template-columns:1fr}}
.over{background:var(--red);color:#fff;padding:12px;border-radius:8px;font-weight:800;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <div class="who" id="hd-agency">—</div>
      <div class="note" id="hd-concept"></div>
    </div>
    <div class="stats-row" id="hd-stats"></div>
    <button id="btn-day">다음 날 ▶</button>
  </div>

  <div id="gameover" style="display:none" class="panel"><div class="over" id="gameover-msg"></div></div>

  <div class="tabs">
    <button class="tab on" data-tab="today">오늘</button>
    <button class="tab" data-tab="roster">트레이너</button>
    <button class="tab" data-tab="tour">대회</button>
    <button class="tab" data-tab="market">시장</button>
    <button class="tab" data-tab="league">리그</button>
    <button class="tab" data-tab="news">소식</button>
  </div>

  <!-- 관전 화면: 평소엔 접혀 있고 [관전] 누르면 열린다 -->
  <div class="panel" id="watch-panel" style="display:none">
    <div class="panel-t" id="watch-title">관전</div>
    <div class="scene" id="scene">
      <div class="plat foe"></div><div class="plat me"></div>
      <div class="hpbox foe" id="hp-p2"></div>
      <div class="hpbox me" id="hp-p1"></div>
      <div class="spr foe" id="sp-p2"></div>
      <div class="spr me" id="sp-p1"></div>
    </div>
    <div class="tbox" id="tbox"></div>
    <div class="ctrl" style="margin-top:8px">
      <select id="speed">
        <option value="0.7">0.7배속 (느리게)</option>
        <option value="1" selected>1배속</option>
        <option value="2">2배속</option>
        <option value="4">4배속</option>
        <option value="0">즉시(로그만)</option>
      </select>
      <button id="watch-close" class="ghost">닫기</button>
    </div>
    <div id="log" style="margin-top:8px"></div>
  </div>

  <!-- 오늘 -->
  <div class="panel" data-panel="today">
    <div class="panel-t">오늘 일정</div>
    <div id="today-sched"></div>
  </div>
  <div class="panel" data-panel="today">
    <div class="panel-t">트레이너에게 오늘 할 일 배정</div>
    <div class="tcards" id="today-cards"></div>
  </div>
  <div class="panel" data-panel="today">
    <div class="panel-t">어제 리포트</div>
    <div id="today-report"></div>
  </div>

  <!-- 트레이너 -->
  <div class="panel" data-panel="roster" style="display:none">
    <div class="panel-t">내 트레이너</div>
    <div id="roster-body"></div>
  </div>

  <!-- 대회 -->
  <div class="panel" data-panel="tour" style="display:none">
    <div class="panel-t">다가오는 대회</div>
    <div id="tour-upcoming"></div>
  </div>
  <div class="panel" data-panel="tour" style="display:none">
    <div class="panel-t">지난 대회</div>
    <div class="lg-cols">
      <div id="tour-list"></div>
      <div id="tour-matches"></div>
    </div>
  </div>

  <!-- 시장 -->
  <div class="panel" data-panel="market" style="display:none">
    <div class="panel-t">영입 가능 (7일마다 갱신)</div>
    <div class="mkt" id="market-body"></div>
  </div>
  <div class="panel" data-panel="market" style="display:none">
    <div class="panel-t">방출</div>
    <div id="release-body"></div>
  </div>

  <!-- 리그 -->
  <div class="panel" data-panel="league" style="display:none">
    <div class="panel-t">리그 순위표</div>
    <div id="league-body"></div>
  </div>

  <!-- 소식 -->
  <div class="panel" data-panel="news" style="display:none">
    <div class="panel-t">소식</div>
    <div id="news-body"></div>
  </div>

  <div class="panel note">
    배틀 계산은 <b>@pkmn/sim</b>(포켓몬쇼다운 시뮬레이터)이 처리하고, 이 프로젝트가 만든 건
    트레이너 AI 레이어와 매니지먼트 루프다. 스프라이트는 쇼다운 gen5 도트를 링크해서 쓴다.<br>
    <b>미구현(스키마만):</b> 코치 · 계약 협상/바이아웃 · 글로벌 대회 · 타지방 · 전설의 포켓몬 · 콘테스트 · 회복약.
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
