<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트레이너 매니지먼트 — 관동·성도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7;--panel:#fff;--panel2:#f5f7fb;--ink:#1a2233;--sub:#5a6580;
  --line:#c3cddd;--line2:#dde4ef;--accent:#2f5da8;
  --hp-hi:#48c05a;--hp-md:#e8b423;--hp-lo:#e0503f;
  --sky1:#8ec8e8;--sky2:#c8e4f0;--ground:#d8c88a;--ground2:#c0b070;
  --box:#f8f8f8;--boxline:#485870;--red:#c0392b;--blue:#2f5da8;--gold:#a8770b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f;--panel:#1b212e;--panel2:#232b3b;--ink:#e6ecf5;--sub:#9aa7bd;
  --line:#39445a;--line2:#2b3446;--accent:#7aa0dd;
  --sky1:#2a4a68;--sky2:#1e3448;--ground:#4a4430;--ground2:#3a3626;
  --box:#252d3d;--boxline:#7a8aa8;--red:#e5776a;--blue:#7aa0dd;--gold:#d9b64a;}}
:root[data-theme="dark"]{
  --bg:#12161f;--panel:#1b212e;--panel2:#232b3b;--ink:#e6ecf5;--sub:#9aa7bd;
  --line:#39445a;--line2:#2b3446;--accent:#7aa0dd;
  --sky1:#2a4a68;--sky2:#1e3448;--ground:#4a4430;--ground2:#3a3626;
  --box:#252d3d;--boxline:#7a8aa8;--red:#e5776a;--blue:#7aa0dd;--gold:#d9b64a;}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* display를 지정한 클래스가 hidden을 덮어쓰는 걸 막는다 */
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);
  font-family:'Gothic A1',-apple-system,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:17px;margin:0 0 3px}
.sub{color:var(--sub);font-size:12px;margin-bottom:12px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.panel-t{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}

/* ===== 배틀 화면 — 5세대 실기 배치를 따라간다 ===== */
.scene{position:relative;width:100%;aspect-ratio:4/2.55;min-height:230px;border-radius:6px;
  border:3px solid var(--boxline);overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,var(--ground2) 60%,var(--ground) 100%)}
.scene[data-weather="Sandstorm"]{background:linear-gradient(180deg,#c9ac72 0%,#d8c08a 60%,#b09a5e 60%,#c2ad72 100%)}
.scene[data-weather="Sandstorm"]::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(72deg,rgba(255,240,200,.16) 0 2px,transparent 2px 7px);
  animation:sand 700ms linear infinite}
@keyframes sand{to{background-position:34px 0}}

.plat{position:absolute;border-radius:50%;background:rgba(0,0,0,.16)}
.plat.foe{width:30%;height:8%;right:9%;top:42%}
.plat.me{width:36%;height:9%;left:7%;bottom:13%}

.spr{position:absolute;transition:transform .16s ease,opacity .35s}
.spr.foe{width:24%;right:12%;top:12%}
.spr.me{width:30%;left:8%;bottom:13%}
.spr svg,.spr img,.spr canvas{width:100%;height:auto;display:block;image-rendering:pixelated;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.32))}
.spr.hit{animation:shk .3s}
.spr.hurt svg,.spr.hurt img,.spr.hurt canvas{filter:brightness(0) invert(1) drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.spr.dead{transform:translateY(42px);opacity:0}
.spr.enter{animation:enter .45s ease-out}
.spr.glow svg,.spr.glow img,.spr.glow canvas{filter:drop-shadow(0 0 7px #ffe08a) drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.spr.cast{animation:cast .3s ease-out}
.spr.lunge-r{transform:translateX(15%) translateY(-7%)}
.spr.lunge-l{transform:translateX(-15%) translateY(7%)}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8%)}
  45%{transform:translateX(7%)}70%{transform:translateX(-4%)}}
@keyframes enter{0%{opacity:0;transform:translateY(16px) scale(.85)}100%{opacity:1;transform:none}}
@keyframes cast{0%,100%{transform:scale(1)}45%{transform:scale(1.07)}}

/* 기술 애니메이션이 스프라이트를 직접 몰 때는 CSS 전환이 걸리면 프레임이 밀린다 */
.spr[style*="transform"]{transition:none}

/* 상태이상 지속 연출 — 걸려 있는 동안 계속 보인다 (실기는 배지만 뜨지만 눈에 잘 띄는 쪽이 낫다) */
.spr.st-brn svg,.spr.st-brn img,.spr.st-brn canvas{animation:stbrn 1.1s infinite}
.spr.st-psn svg,.spr.st-psn img,.spr.st-psn canvas,
.spr.st-tox svg,.spr.st-tox img,.spr.st-tox canvas{animation:stpsn 1.4s infinite}
.spr.st-par svg,.spr.st-par img,.spr.st-par canvas{animation:stpar 1.6s infinite}
.spr.st-slp svg,.spr.st-slp img,.spr.st-slp canvas{animation:stslp 2.4s infinite}
.spr.st-frz svg,.spr.st-frz img,.spr.st-frz canvas{filter:brightness(1.12) saturate(.45) hue-rotate(155deg)
  drop-shadow(0 0 5px #8fd8ff) drop-shadow(0 3px 2px rgba(0,0,0,.3))}
@keyframes stbrn{0%,100%{filter:drop-shadow(0 3px 2px rgba(0,0,0,.32))}
  50%{filter:brightness(1.1) drop-shadow(0 0 7px #ff8a3a) drop-shadow(0 3px 2px rgba(0,0,0,.32))}}
@keyframes stpsn{0%,100%{filter:drop-shadow(0 3px 2px rgba(0,0,0,.32))}
  50%{filter:saturate(1.3) drop-shadow(0 0 7px #b25ad0) drop-shadow(0 3px 2px rgba(0,0,0,.32))}}
@keyframes stpar{0%,88%,100%{filter:drop-shadow(0 3px 2px rgba(0,0,0,.32))}
  92%{filter:brightness(1.5) drop-shadow(0 0 6px #ffe14a) drop-shadow(0 3px 2px rgba(0,0,0,.32))}}
@keyframes stslp{0%,100%{filter:brightness(.86) drop-shadow(0 3px 2px rgba(0,0,0,.32))}
  50%{filter:brightness(.72) drop-shadow(0 3px 2px rgba(0,0,0,.32))}}

/* 화상 불꽃 / 독 거품 / 얼음 결정 — 스프라이트 위에 얹는 작은 표식 */
.spr::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-repeat:no-repeat;background-size:22% auto;opacity:0}
.spr.st-brn::after{content:'🔥';font-size:15px;opacity:1;
  display:flex;align-items:flex-start;justify-content:center;animation:stfloat 1.1s infinite}
.spr.st-psn::after,.spr.st-tox::after{content:'☠';font-size:15px;opacity:.9;
  display:flex;align-items:flex-start;justify-content:center;animation:stfloat 1.6s infinite}
.spr.st-frz::after{content:'❄';font-size:16px;opacity:1;color:#dff4ff;
  display:flex;align-items:flex-start;justify-content:center;
  text-shadow:0 0 5px #1d5f92,0 1px 2px #0a2740}
.spr.st-par::after{content:'⚡';font-size:15px;opacity:1;
  display:flex;align-items:flex-start;justify-content:center;animation:stpar 1.6s infinite}
.spr.st-slp::after{content:'z';font-family:var(--font);font-weight:800;color:#cfe0ff;font-size:15px;
  display:flex;align-items:flex-start;justify-content:flex-end;padding-right:12%;animation:stfloat 2.4s infinite}
@keyframes stfloat{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-7px);opacity:1}}

/* 트레이너 이름표 — 빈 모서리에 놓아 누가 누구 포켓몬인지 바로 잡힌다 */
.btname{position:absolute;font-size:10.5px;line-height:1.25;padding:3px 8px;border-radius:4px;
  background:rgba(16,20,32,.72);border:1px solid rgba(255,255,255,.16);color:#e8ecf6;
  pointer-events:none;max-width:40%;z-index:5}
.btname b{font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btname em{font-style:normal;display:block;font-size:9px;opacity:.7;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.btname:empty{display:none}
.btname.foe{right:3%;top:5%;text-align:right}
.btname.me{left:3%;bottom:5%}

/* 남은 포켓몬 — 실기의 몬스터볼 줄 */
.hpb-balls{display:flex;gap:3px;margin-top:3px}
.hpb-balls i{width:7px;height:7px;border-radius:50%;background:#7ee08a;
  border:1px solid rgba(0,0,0,.45);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.hpb-balls i.out{background:#4a4f5c;box-shadow:none;opacity:.65}

/* HP 박스 — 실기처럼 이름/성별/Lv + HP 라벨 바, 내 쪽만 실수치 */
.hpbox{position:absolute;background:var(--box);border:2px solid var(--boxline);border-radius:5px;
  padding:3px 7px 4px;width:46%;box-shadow:1px 2px 0 rgba(0,0,0,.22)}
.hpbox.foe{left:3%;top:5%}
.hpbox.me{right:3%;bottom:5%}
.hpb-n{font-size:11.5px;font-weight:800;display:flex;justify-content:space-between;
  align-items:baseline;gap:5px;line-height:1.25}
.hpb-n em{font-style:normal;font-weight:700;color:var(--sub);font-size:10px}
.hpb-n i{font-style:normal;font-size:10px;margin-left:2px}
.hpb-n i.g-m{color:#5a9ad8}.hpb-n i.g-f{color:#d87a9a}
.hpb-n i.st{background:var(--accent);color:#fff;border-radius:3px;padding:0 4px;
  font-size:9px;font-weight:800;margin-left:4px;vertical-align:1px}
.hpb-row{display:flex;align-items:center;gap:4px;margin-top:2px}
.hplabel{font-size:8.5px;font-weight:800;color:#d8b23a;letter-spacing:.5px}
.hpb-bar{flex:1;height:6px;background:#4a4a4a;border-radius:3px;overflow:hidden;
  border:1px solid var(--boxline)}
.hpb-bar i{display:block;height:100%}  /* 폭은 JS가 프레임 단위로 굴린다 (실기처럼 깎여 내려가게) */
.hpb-num{text-align:right;font-size:10px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.2;margin-top:1px}
.hpb-boost{font-size:9px;color:var(--gold);font-weight:700;line-height:1.2}

/* 이펙트 */
.fx{position:absolute;pointer-events:none;font-weight:800;font-size:15px;z-index:4;
  text-shadow:0 0 6px rgba(0,0,0,.6);animation:fxup .9s ease-out forwards}
@keyframes fxup{0%{opacity:0;transform:translateY(6px) scale(.8)}
  25%{opacity:1;transform:translateY(-2px) scale(1.1)}100%{opacity:0;transform:translateY(-28px)}}
.burst{position:absolute;border-radius:50%;pointer-events:none;z-index:3;
  animation:brs .46s ease-out forwards}
@keyframes brs{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(2.7)}}
.particle{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:3;
  animation:part .62s ease-out forwards}
@keyframes part{0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.proj{position:absolute;width:13%;padding-bottom:13%;border-radius:50%;pointer-events:none;z-index:3;
  animation:proj linear forwards}
@keyframes proj{0%{opacity:.4;transform:translate(0,0) scale(.6)}
  20%{opacity:1;transform:translate(calc(var(--tx)*.2),calc(var(--ty)*.2)) scale(1)}
  100%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1.1)}}
.flash{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;
  animation:flsh ease-out forwards}
@keyframes flsh{0%{opacity:0}25%{opacity:.45}100%{opacity:0}}

/* 실제 기술 애니메이션이 그려지는 캔버스 (src/ui/move-fx.js) */
.fxcanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;
  image-rendering:pixelated}

/* 기술별 고유 연출 (src/data/move-anim.js의 원형에 대응) */
.scene.quaking{animation:qk .5s ease-in-out}
@keyframes qk{0%,100%{transform:translate(0,0)}
  15%{transform:translate(-4px,3px)}35%{transform:translate(4px,-3px)}
  55%{transform:translate(-3px,-2px)}75%{transform:translate(3px,2px)}}
.spr.stomp{animation:stomp .45s ease-out}
@keyframes stomp{0%,100%{transform:translateY(0)}30%{transform:translateY(-14%)}55%{transform:translateY(4%)}}

.beamfx{position:absolute;height:8px;transform-origin:left center;pointer-events:none;z-index:3;
  border-radius:4px;filter:blur(1px);animation:beamgrow ease-out forwards}
@keyframes beamgrow{0%{opacity:0;clip-path:inset(0 100% 0 0)}
  25%{opacity:1;clip-path:inset(0 0 0 0)}80%{opacity:1}100%{opacity:0}}

.rockfx{position:absolute;width:4.5%;padding-bottom:4.5%;border-radius:22%;pointer-events:none;z-index:3;
  animation:fall ease-in forwards}
.meteorfx{position:absolute;width:13%;padding-bottom:13%;border-radius:50%;pointer-events:none;z-index:3;
  filter:blur(.5px);animation:fall ease-in forwards}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}
  15%{opacity:1}100%{opacity:1;transform:translateY(var(--fall)) rotate(140deg)}}

.slashmark{position:absolute;width:18%;padding-bottom:18%;pointer-events:none;z-index:4;
  border-left:3px solid;border-top:3px solid;transform:rotate(35deg);
  animation:mk .43s ease-out forwards}
.bitemark{position:absolute;width:16%;padding-bottom:16%;pointer-events:none;z-index:4;
  border:3px dashed;border-radius:50%;animation:mk .43s ease-out forwards}
@keyframes mk{0%{opacity:0;transform:scale(1.5) rotate(20deg)}
  30%{opacity:1;transform:scale(1) rotate(35deg)}100%{opacity:0;transform:scale(.9) rotate(40deg)}}

.ringfx{position:absolute;width:20%;padding-bottom:20%;border:3px solid;border-radius:50%;
  pointer-events:none;z-index:3;animation:rng ease-out forwards}
@keyframes rng{0%{opacity:0;transform:scale(.3)}35%{opacity:.95}100%{opacity:0;transform:scale(1.9)}}

.arcfx{position:absolute;width:22%;padding-bottom:22%;border-top:4px solid;border-right:4px solid;
  border-radius:50%;pointer-events:none;z-index:3;animation:arc ease-out forwards}
@keyframes arc{0%{opacity:0;transform:rotate(-40deg) scale(.6)}
  40%{opacity:1;transform:rotate(10deg) scale(1)}100%{opacity:0;transform:rotate(40deg) scale(1.2)}}

.risefx{position:absolute;width:5px;height:11px;border-radius:3px;pointer-events:none;z-index:3;
  animation:rise .95s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}

.gwave{position:absolute;left:0;right:0;bottom:18%;height:5px;pointer-events:none;z-index:2;
  opacity:.75;animation:gw ease-out forwards}
@keyframes gw{0%{opacity:0;transform:scaleX(.2)}30%{opacity:.8}100%{opacity:0;transform:scaleX(1.6)}}

/* 자막 박스 — 실기처럼 2줄, 아래쪽 전체 폭 */

.tbox{margin-top:6px;background:#1a1f2b;border:3px solid var(--boxline);border-radius:6px;
  padding:9px 13px;min-height:62px;font-size:14px;font-weight:700;line-height:1.55;color:#f2f5fa;
  text-shadow:1px 1px 0 rgba(0,0,0,.55)}
.tbox .tline{min-height:1.55em;white-space:pre-wrap}

.trainers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.trainers{grid-template-columns:1fr}}
.tcard{background:var(--panel2);border:2px solid var(--line2);border-radius:8px;padding:10px}
.tname{font-weight:800;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.stat{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:12px}
.stat b{width:44px;font-weight:400;color:var(--sub)}
.stat input[type=range]{flex:1;min-width:0;height:15px;accent-color:var(--accent);cursor:pointer}
.stat span{width:22px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
select{font-family:inherit;font-size:11px;padding:3px 5px;border-radius:5px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;
  border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
label.chk{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px;cursor:pointer}
#log{background:var(--panel2);border:2px solid var(--line2);border-radius:8px;padding:10px;
  height:280px;overflow-y:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;
  line-height:1.6;white-space:pre-wrap;word-break:break-word}
.l-turn{color:var(--accent);font-weight:700;margin-top:7px;border-top:1px dashed var(--line);padding-top:5px}
.l-turn:first-child{margin-top:0;border-top:none;padding-top:0}
.l-red{color:var(--red)}.l-blue{color:var(--blue)}.l-sub{color:var(--sub)}.l-gold{color:var(--gold)}
.l-think{color:var(--sub);font-size:11px;padding-left:9px;border-left:2px solid var(--line2)}
.l-win{font-weight:800;color:var(--gold);margin-top:7px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
th,td{border:1px solid var(--line2);padding:5px 7px;text-align:left}
th{background:var(--panel2);color:var(--sub)}td.n{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--sub);line-height:1.7}
.sub-t{color:var(--sub);font-weight:400}
/* ================= FM식 셸 — 상단바 + 좌측 메뉴 + 본문 ================= */
body{padding:0}
.app[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100vh}

.topbar{display:flex;align-items:center;gap:16px;padding:9px 14px;
  background:var(--panel);border-bottom:2px solid var(--line);flex:none}
.tb-club{min-width:150px}
.tb-club b{display:block;font-size:14px;line-height:1.25}
.tb-club span{font-size:11px;color:var(--sub)}
.tb-info{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);flex:1}
.tb-info b{color:var(--ink);font-size:13px;margin-left:3px}
.tb-info b.neg{color:var(--red)}
#tb-continue{padding:8px 18px}

.body{display:flex;flex:1;min-height:0}
.side{width:170px;flex:none;background:var(--panel2);border-right:2px solid var(--line);
  padding:8px 0;overflow-y:auto}
.side .grp{font-size:10px;font-weight:800;color:var(--sub);padding:10px 14px 4px;letter-spacing:.5px}
.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;
  border:none;border-left:3px solid transparent;border-radius:0;color:var(--sub);
  font-size:13px;font-weight:700;padding:8px 14px}
.side button:hover{background:var(--panel);color:var(--ink)}
.side button.on{background:var(--panel);color:var(--ink);border-left-color:var(--accent)}
.side .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:800;
  border-radius:9px;padding:0 6px;min-width:17px;text-align:center}
.side button.lock{opacity:.45}

.main{flex:1;min-width:0;overflow-y:auto;padding:14px 16px}
.page-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.page-h h2{font-size:17px;margin:0}
.page-h .note{margin:0}

/* FM식 표 */
.grid{width:100%;border-collapse:collapse;font-size:12.5px}
.grid th{text-align:left;font-size:10.5px;color:var(--sub);font-weight:800;
  border-bottom:2px solid var(--line);padding:5px 7px;white-space:nowrap}
.grid td{border-bottom:1px solid var(--line2);padding:6px 7px}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover{background:var(--panel2)}
.grid td.n,.grid th.n{text-align:right;font-variant-numeric:tabular-nums}
.grid .nm{font-weight:800}

/* 능력치 숫자 — FM처럼 값에 따라 색이 붙는다 */
.at{display:inline-block;min-width:20px;text-align:center;border-radius:3px;
  font-weight:800;font-size:12px;padding:0 3px}
.at.lo{color:#c76a5c}.at.mid{color:var(--sub)}.at.hi{color:#3f9a53}.at.top{color:#2f7fd0}

/* 받은 메시지함 */
.inbox{border:2px solid var(--line);border-radius:8px;overflow:hidden}
.msg{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2);
  background:var(--panel);cursor:pointer}
.msg:last-child{border-bottom:none}
.msg:hover{background:var(--panel2)}
.msg.unread{border-left:3px solid var(--accent)}
.msg .d{font-size:10.5px;color:var(--sub);width:52px;flex:none;padding-top:2px}
.msg .t{font-weight:800;font-size:13px;margin-bottom:2px}
.msg .x{font-size:12px;color:var(--sub);line-height:1.6}

/* 카드 묶음 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--panel);border:2px solid var(--line2);border-radius:8px;padding:10px}
.card h3{font-size:13.5px;margin:0 0 6px}
.card.sel{border-color:var(--accent)}

/* 포켓몬 줄 */
.mon{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2)}
.mon:last-child{border-bottom:none}
.mon img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated;flex:none}
.mon .nm{font-weight:800;font-size:12.5px}
.mon .lv{font-size:11px;color:var(--sub)}
.mon .mv{font-size:10.5px;color:var(--sub);margin-left:auto;text-align:right;line-height:1.5}
.xpbar{height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:var(--accent)}

/* 계약 협상 — FM처럼 대화로 주고받는다 */
.nego{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
@media(max-width:820px){.nego{grid-template-columns:1fr}}
.chat{border:2px solid var(--line);border-radius:8px;background:var(--panel);
  padding:12px;max-height:52vh;overflow-y:auto}
.line{margin-bottom:12px;max-width:86%}
.line .who{font-size:10.5px;color:var(--sub);font-weight:800;margin-bottom:3px}
.line .bub{background:var(--panel2);border:2px solid var(--line2);border-radius:10px;
  padding:8px 11px;font-size:12.5px;line-height:1.7}
.line.me{margin-left:auto}
.line.me .who{text-align:right}
.line.me .bub{background:var(--accent);border-color:var(--accent);color:#fff}
.line.sys{max-width:100%;text-align:center}
.line.sys .bub{background:transparent;border:none;color:var(--sub);font-size:11.5px;padding:2px}

/* 맵 — 원작 지도 위에 점을 찍는다 */
.map-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media(max-width:900px){.map-grid{grid-template-columns:1fr}}
.map-wrap{position:relative;width:100%;aspect-ratio:1500/1316;border:2px solid var(--line);
  border-radius:8px;overflow:hidden;background:#1b2a3a}
.map-img{position:absolute;top:0;height:100%;max-width:none;display:block}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);
  border:2px solid #fff;background:#5fbf72;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.6);cursor:pointer}
.dot.town{background:#4a90d0;width:16px;height:16px}
.dot.dungeon{background:#a06ad0}
.dot.hard{background:#d0503f}
.dot:hover{transform:translate(-50%,-50%) scale(1.35)}
.dot.on{box-shadow:0 0 0 4px rgba(255,255,255,.55),0 1px 4px rgba(0,0,0,.6);transform:translate(-50%,-50%) scale(1.3)}
.map-panel{min-height:200px}
.reg.on{background:var(--accent);color:#fff}

/* 기술 고르기 */
.moves{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;align-items:center}
.mvopt{font-size:11.5px;display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.mvopt input{margin:0}

.watch-ov{position:fixed;inset:0;z-index:50;background:rgba(8,11,18,.82);
  overflow-y:auto;padding:16px}
.watch-ov[hidden]{display:none!important}
.watch-inner{max-width:820px;margin:0 auto}

/* ================= 오프닝 (§3.10) ================= */
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  display:flex;align-items:center;justify-content:center;padding:20px}
.ov[hidden]{display:none!important}
.ov-page{display:none;width:100%;max-width:720px}
.ov-page.on{display:block}

/* 타이틀 */
.title-art{text-align:center;padding:26px 0 10px}
.title-art h1{font-size:30px;letter-spacing:-.5px;margin:0 0 6px;line-height:1.25}
.title-art .tag{color:var(--sub);font-size:13px}
.title-art .region{display:inline-block;margin-top:14px;font-size:11px;font-weight:800;
  color:var(--accent);border:2px solid var(--accent);border-radius:20px;padding:3px 12px}
.press{margin-top:34px;text-align:center;font-size:13px;font-weight:800;color:var(--sub);
  animation:blink 1.4s steps(1) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
.title-menu{margin-top:22px;display:flex;flex-direction:column;gap:8px;align-items:center}
.title-menu button{min-width:220px}

/* 공통 폼 */
.ov-h{font-size:18px;font-weight:800;margin:0 0 4px}
.ov-sub{color:var(--sub);font-size:12px;margin-bottom:16px}
.ov-row{display:flex;gap:8px;margin-top:14px}
.ov-row button{flex:1}
input[type=text]{font-family:inherit;font-size:15px;padding:10px 12px;width:100%;
  border:2px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
input[type=number]{font-family:inherit;font-size:13px;padding:5px 7px;width:92px;text-align:right;
  border:2px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}

/* 소속사 선택 — 등급 라벨은 절대 안 보인다 (§3.3) */
.ag-list{display:grid;gap:10px}
.ag{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;
  cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.ag:hover{border-color:var(--accent)}
.ag.on{border-color:var(--accent);background:var(--panel2)}
.ag b{font-size:15px;display:block;margin-bottom:2px}
.ag .blurb{color:var(--sub);font-size:12px;margin-bottom:9px}
.gauge{display:flex;align-items:center;gap:8px;margin-top:5px}
.gauge span{font-size:11px;color:var(--sub);width:64px;flex:none}
.gauge .pips{display:flex;gap:3px}
.gauge i{width:20px;height:8px;border-radius:2px;background:var(--line2)}
.gauge i.f{background:var(--accent)}
.gauge.hope i.f{background:var(--gold)}

/* 스카우트 / 계약 협상 (§5.3) */
.scout-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.cand{background:var(--panel);border:2px solid var(--line2);border-radius:9px;padding:10px;
  cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;margin-bottom:8px}
.cand:hover{border-color:var(--accent)}
.cand.on{border-color:var(--accent);background:var(--panel2)}
.cand b{font-size:14px}
.cand .tagn{font-size:10px;color:var(--sub);margin-left:4px}
.terms{display:grid;gap:7px}
.term{display:flex;align-items:center;justify-content:space-between;gap:8px}
.term label{font-size:12px;font-weight:700}
.term .u{font-size:11px;color:var(--sub);margin-left:3px}
.verdict{margin-top:10px;border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.65}
.verdict.no{background:rgba(224,80,63,.12);border:2px solid var(--red)}
.verdict.yes{background:rgba(72,192,90,.12);border:2px solid var(--hp-hi)}
.verdict b{display:block;margin-bottom:3px}

/* 튜토리얼 말풍선 — 기존 화면 위에 얹기만 한다 */
.coach{position:fixed;inset:0;z-index:70;background:rgba(6,10,18,.55)}
.coach[hidden]{display:none!important}
.coach-hole{position:absolute;border:3px solid var(--accent);border-radius:10px;
  box-shadow:0 0 0 9999px rgba(6,10,18,.55);pointer-events:none;transition:all .25s ease}
.coach-box{position:absolute;max-width:330px;background:var(--panel);border:2px solid var(--accent);
  border-radius:10px;padding:12px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
.coach-box b{display:block;font-size:14px;margin-bottom:4px}
.coach-box p{margin:0 0 10px;font-size:12.5px;color:var(--sub);line-height:1.7}
.coach-box .cn{display:flex;gap:6px;align-items:center}
.coach-box .step{font-size:11px;color:var(--sub);margin-left:auto}

.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{background:transparent;color:var(--sub);border:2px solid var(--line2)}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lg-row{cursor:pointer}
.lg-row:hover td{background:var(--panel2)}
.lg-row.on td{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
.lg-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.lg-cols{grid-template-columns:1fr}}

/* ===== 게임 UI ===== */
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.topbar .who{font-weight:800;font-size:15px}
.stats-row{display:flex;flex-wrap:wrap;gap:14px;font-size:12px}
.stats-row b{font-size:14px;font-variant-numeric:tabular-nums}
.stats-row .neg{color:var(--red)}
#btn-day{font-size:14px;padding:10px 20px}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.tcards{grid-template-columns:1fr}}
.tc{background:var(--panel2);border:2px solid var(--line2);border-radius:8px;padding:10px}
.tc-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:5px}
.tc-h b{font-size:14px}
.cond{height:7px;background:var(--line2);border-radius:4px;overflow:hidden;margin:4px 0}
.cond i{display:block;height:100%;transition:width .3s}
.tc select{width:100%;margin-top:6px;font-size:12px;padding:5px}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;
  border:1px solid var(--line);color:var(--sub)}
.stars{color:var(--gold);letter-spacing:1px}
.rep-line{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--sub);margin-top:3px}
.dayrep{background:var(--panel2);border:2px solid var(--line2);border-radius:8px;padding:10px;font-size:12px;line-height:1.7}
.dayrep .big{font-weight:800;font-size:13px}
.mkt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.mkt{grid-template-columns:1fr}}
.over{background:var(--red);color:#fff;padding:12px;border-radius:8px;font-weight:800;text-align:center}
</style>
</head>
<body>
<!-- ================= 오프닝 (§3.10) ================= -->
<div class="ov" id="opening" hidden>
  <!-- 1. 타이틀 -->
  <section class="ov-page" data-page="title">
    <div class="title-art">
      <h1>트레이너 매니지먼트</h1>
      <div class="tag">소속사를 맡아 트레이너를 키운다</div>
      <div class="region">관동 · 성도</div>
    </div>
    <div class="press" id="title-press">아무 키나 누르세요</div>
    <div class="title-menu" id="title-menu" hidden>
      <button id="btn-resume">이어하기</button>
      <button class="ghost" id="btn-newgame">새로 시작</button>
      <div class="note" id="resume-note"></div>
    </div>
  </section>

  <!-- 2. 이름 입력 -->
  <section class="ov-page" data-page="name">
    <h2 class="ov-h">대표 이름</h2>
    <div class="ov-sub">소속사를 맡을 사람의 이름입니다.</div>
    <input type="text" id="in-name" maxlength="12" placeholder="이름을 입력하세요" autocomplete="off">
    <div class="note" id="name-msg" style="margin-top:8px"></div>
    <div class="ov-row">
      <button class="ghost" data-back="title">뒤로</button>
      <button id="btn-name-ok">다음</button>
    </div>
  </section>

  <!-- 3. 소속사 선택 — 등급 라벨 없음 (§3.3) -->
  <section class="ov-page" data-page="agency">
    <h2 class="ov-h">어디서 시작하시겠습니까</h2>
    <div class="ov-sub">모기업 자금과 이사진 기대치가 앞으로의 난이도를 정합니다.</div>
    <div class="ag-list" id="ag-list"></div>
    <div class="ov-row">
      <button class="ghost" data-back="name">뒤로</button>
      <button id="btn-agency-ok" disabled>이 소속사로 시작</button>
    </div>
  </section>

</div>

<!-- 튜토리얼 말풍선 -->
<div class="coach" id="coach" hidden>
  <div class="coach-hole" id="coach-hole"></div>
  <div class="coach-box" id="coach-box">
    <b id="coach-t"></b>
    <p id="coach-p"></p>
    <div class="cn">
      <button id="coach-next">다음</button>
      <button class="ghost" id="coach-skip">건너뛰기</button>
      <span class="step" id="coach-step"></span>
    </div>
  </div>
</div>

<div class="app" id="app" hidden>

  <!-- 상단 바 — 소속사 / 날짜 / 자금 / 계속 -->
  <header class="topbar">
    <div class="tb-club">
      <b id="tb-agency">—</b>
      <span id="tb-manager"></span>
    </div>
    <div class="tb-info">
      <span>날짜 <b id="tb-date">—</b></span>
      <span>자금 <b id="tb-funds">—</b></span>
      <span>주급 <b id="tb-wage">—</b></span>
      <span>평판 <b id="tb-rep">—</b></span>
    </div>
    <button id="tb-continue">계속 ▶</button>
  </header>

  <div class="body">
    <!-- 좌측 메뉴 -->
    <nav class="side" id="side"></nav>

    <!-- 본문 -->
    <main class="main" id="main"></main>
  </div>
</div>

<!-- 관전 화면 — 오버레이로 뜬다 -->
<div class="watch-ov" id="watch-ov" hidden>
  <div class="watch-inner">
    <div class="panel" id="watch-panel" style="display:none">
      <div class="panel-t" id="watch-title">관전</div>
      <div class="scene" id="scene">
        <div class="plat foe"></div><div class="plat me"></div>
        <div class="hpbox foe" id="hp-p2"></div>
        <div class="hpbox me" id="hp-p1"></div>
        <div class="spr foe" id="sp-p2"></div>
        <div class="spr me" id="sp-p1"></div>
        <div class="btname foe" id="tn-p2"></div>
        <div class="btname me" id="tn-p1"></div>
      </div>
      <div class="tbox" id="tbox"></div>
      <div class="ctrl" style="margin-top:8px">
        <select id="speed">
          <option value="0.7">0.7배속 (느리게)</option>
          <option value="1" selected>1배속</option>
          <option value="2">2배속</option>
          <option value="4">4배속</option>
          <option value="0">즉시(로그만)</option>
        </select>
        <label class="chk"><input type="checkbox" id="sfx-on" checked> 효과음</label>
        <label class="chk bgm-control"><input type="checkbox" id="bgm-on" checked> BGM</label><label class="bgm-control">음량<input id="bgm-volume" aria-label="BGM 음량" type="range" min="0" max="100" value="18"></label><span id="bgm-status" role="status"></span>
        <button id="watch-pause" class="ghost">⏸ 일시정지</button>
        <button id="watch-close" class="ghost">닫기</button>
      </div>
      <div id="log" style="margin-top:8px"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
